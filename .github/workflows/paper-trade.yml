name: paper-trade

# Since 2026-10-09 the weekday trader runs on the Oracle Cloud VM (deploy/oracle/), not here.
# This workflow stays as the manual fallback (workflow_dispatch: morning | afternoon | close)
# and runs the Saturday improve. Needs repository secrets DHAN_CLIENT_ID, DHAN_PIN,
# DHAN_TOTP_SECRET (optional: ANTHROPIC_API_KEY for Claude's weekly proposals).
#
# Fallback use: a GitHub job is capped at 6 hours, so a trading day is split into two runs
# that continue the same decision journal (state/live/<date>.jsonl, restart-safe):
#   morning   check Dhan, then decide on every candle 09:15 .. 12:30
#   afternoon queued behind the morning run; 12:30 .. close, records the day
#   close     records the day if the afternoon run was missed
# Never dispatch these while the Oracle trader is running: two traders would write one journal.
# The weekday crons were removed: they ran hours late and the late close replayed old days.
on:
  schedule:
    - cron: "52 4 * * 6"      # 10:22 IST Saturday improve
  workflow_dispatch:
    inputs:
      command:
        description: "morning | afternoon | close | improve | check"
        default: check

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_PIN: ${{ secrets.DHAN_PIN }}
      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A queued run checks out the commit it was queued at; catch up with the journal the
      # previous run pushed since then, or the two runs' commits conflict.
      - name: Sync to latest
        run: git pull -q --ff-only origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*) m="${{ inputs.command }}" ;;
            *"15 3 * * 1-5")     m=morning ;;
            *"45 6 * * 1-5")     m=afternoon ;;
            *"25 10 * * 1-5")    m=close ;;
            *"52 4 * * 6")       m=improve ;;
            *)                   m=check ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "mode: $m"

      - name: Git identity + push helper
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          cat > /tmp/push.sh <<'EOF'
          #!/usr/bin/env bash
          # commit bot output and push, rebasing over any concurrent commits
          python -m algo.cli dashboard >/dev/null 2>&1 || true
          git add state reports dashboard/data.json >/dev/null 2>&1
          git diff --cached --quiet && exit 0
          git commit -q -m "paper-trade: $1 $(TZ=Asia/Kolkata date '+%F %H:%M')"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "push failed" >&2
          EOF
          chmod +x /tmp/push.sh

      - name: Dhan check
        if: steps.mode.outputs.mode == 'morning' || steps.mode.outputs.mode == 'check'
        run: |
          mkdir -p reports
          { echo "# Dhan check $(TZ=Asia/Kolkata date '+%F %H:%M') IST"; echo '```';
            python -m algo.cli check 2>&1 | grep -v -i -E "pin|secret|token=" ; echo '```'; } > reports/dhan_check.md
          cat reports/dhan_check.md
          /tmp/push.sh check

      - name: Trade live
        if: steps.mode.outputs.mode == 'morning' || steps.mode.outputs.mode == 'afternoon'
        run: |
          until_arg=""
          [ "${{ steps.mode.outputs.mode }}" = "morning" ] && until_arg="--until 12:30"
          python -m algo.cli trade-live $until_arg &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 60; n=$((n + 1))
            [ $((n % 15)) -eq 0 ] && /tmp/push.sh "live ${{ steps.mode.outputs.mode }}"
          done
          wait "$pid"

      - name: Close (record any missed day)
        if: steps.mode.outputs.mode == 'close'
        run: python -m algo.cli catch-up --days 5 && python -m algo.cli leaderboard

      - name: Improve
        if: steps.mode.outputs.mode == 'improve'
        run: python -m algo.cli improve && python -m algo.cli leaderboard

      - name: Commit results
        if: always()
        run: /tmp/push.sh "${{ steps.mode.outputs.mode }}"

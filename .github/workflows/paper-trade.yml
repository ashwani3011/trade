name: paper-trade

# Manual-only: the Claude Code session routine is the active scheduler. To use Actions
# instead, restore the schedule below and merge this file to the default branch.
#  schedule:
#    - cron: "10 4-10 * * 1-5"   # hourly 09:40-15:40 IST: auto (live, then final record)
#    - cron: "50 4 * * 6"        # 10:20 IST Saturday: weekly self-improvement review
on:
  workflow_dispatch:
    inputs:
      command:
        description: "auto | improve | leaderboard"
        default: auto

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      DHAN_PIN: ${{ secrets.DHAN_PIN }}
      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Pick command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cmd=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 4 * * 6" ]; then
            echo "cmd=improve" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        run: |
          case "${{ steps.cmd.outputs.cmd }}" in
            auto)     python -m algo.cli auto ;;
            improve)  python -m algo.cli improve && python -m algo.cli leaderboard ;;
            *)        python -m algo.cli leaderboard ;;
          esac

      - name: Commit results
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          git add state reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "paper-trade: ${{ steps.cmd.outputs.cmd }} $(TZ=Asia/Kolkata date +%F)"
          git push

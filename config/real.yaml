# Real-money execution of ONE variant on Dhan (owner's instruction, 8 Oct 2026).
# Re-read on every candle, so a committed change reaches the server within 15 minutes
# (the push timer pulls). On the server, `touch ~/trade/KILL` stops it instantly.
#
# mode:  off     no new entries; open real positions are still managed to their exits
#        shadow  orders are built and journaled but never sent (fills simulated from candles)
#        live    real orders are sent to Dhan
# kill: true     cancel the stops, exit every real position at market, no entries today
mode: shadow
kill: false
variant: pdb.base
host: paper-trader          # runs only on the Oracle VM (never on GitHub or in a Claude container)
capital: 20000
risk_per_trade: 200         # Rs lost if the stop is hit (quantity = 200 / stop distance)
max_entries_per_day: 5
max_positions: 3            # same as the paper strategy
daily_loss_limit: 600       # no entry that could push realised loss past this; day P&L at -600 exits all
max_leverage: 5.0           # MIS: total position value <= capital x 5
last_entry: "14:30"         # no new entries after this (pdb itself stops at 13:30)
squareoff: "15:10"          # exit everything at the first check after this
sl_limit_buffer_pct: 0.5    # if Dhan refuses a stop-loss-market order, use a stop-limit this far past the trigger
